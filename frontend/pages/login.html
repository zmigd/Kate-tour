<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід — TourAgency</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar" id="main-nav"></nav>

  <div class="page-center">
    <div class="form-card">
      <div class="form-card__title">Вхід до системи</div>
      <div class="form-card__sub">Раді бачити вас знову!</div>

      <div id="alert"></div>

      <form id="form" autocomplete="on">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">
          Увійти →
        </button>
      </form>

      <hr class="divider">
      <div style="background:#F9FAFB;border-radius:8px;padding:.9rem 1rem;font-size:.8rem;color:var(--muted)">
        <strong style="color:var(--text-2)">Тестові акаунти:</strong><br>
        🔑 admin@tour.com · 123456 (адмін)<br>
        👔 manager@tour.com · 123456 (менеджер)<br>
        👤 client@tour.com · 123456 (клієнт)
      </div>

      <div class="form-foot">
        Немає акаунту? <a href="/pages/register.html">Зареєструватись</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">✈ TourAgency</div>
      <div class="footer-copy">© 2025 TourAgency</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      alertEl.innerHTML = '';
      try {
        const data = await api.post('/auth/login', {
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user',  JSON.stringify(data.user));
        window.location.href = (data.user.role === 'manager' || data.user.role === 'admin')
          ? '/pages/manager/dashboard.html' : '/';
      } catch (err) {
        alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
