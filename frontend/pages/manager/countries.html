<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Країни — TourAgency</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar" id="main-nav"></nav>

  <div class="mgr-layout">
    <nav class="mgr-sidebar" id="mgr-sidebar"></nav>

    <main class="mgr-content">
      <div class="mgr-toolbar">
        <h2>Країни</h2>
        <button class="btn btn-success" onclick="openModal()">+ Додати</button>
      </div>
      <div id="alert"></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Назва</th><th>Код</th><th>Опис</th><th>Дії</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-hdr">
        <h3 id="modal-title">Нова країна</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modal-alert"></div>
      <form id="frm">
        <input type="hidden" id="f-id">
        <div class="form-group"><label>Назва *</label><input id="f-name" required placeholder="Туреччина"></div>
        <div class="form-group"><label>Код *</label><input id="f-code" required placeholder="TR" maxlength="5"></div>
        <div class="form-group"><label>Опис</label><textarea id="f-desc" rows="2"></textarea></div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Зберегти</button>
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Скасувати</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/manager.js"></script>
  <script>
    checkManager();
    renderSidebar('countries');

    async function load() {
      const tbody = document.getElementById('tbody');
      try {
        const list = await api.get('/countries');
        tbody.innerHTML = list.length
          ? list.map(c => `
              <tr>
                <td><strong>${c.name}</strong></td>
                <td><code>${c.code}</code></td>
                <td style="color:var(--muted);font-size:.85rem">${c.description || '—'}</td>
                <td><div class="tbl-actions">
                  <button class="btn btn-ghost btn-sm" onclick='edit(${JSON.stringify(c)})'>✏️</button>
                  <button class="btn btn-danger btn-sm" onclick="del('${c._id}')">🗑</button>
                </div></td>
              </tr>`).join('')
          : '<tr><td colspan="4"><div class="empty"><p>Країн ще немає</p></div></td></tr>';
      } catch (err) {
        document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function openModal(c) {
      document.getElementById('modal-title').textContent = c ? 'Редагувати країну' : 'Нова країна';
      document.getElementById('f-id').value   = c?._id         || '';
      document.getElementById('f-name').value = c?.name        || '';
      document.getElementById('f-code').value = c?.code        || '';
      document.getElementById('f-desc').value = c?.description || '';
      document.getElementById('modal-alert').innerHTML = '';
      document.getElementById('modal').classList.add('open');
    }
    function edit(c)    { openModal(c); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    document.getElementById('frm').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('f-id').value;
      const body = {
        name: document.getElementById('f-name').value,
        code: document.getElementById('f-code').value.toUpperCase(),
        description: document.getElementById('f-desc').value || undefined
      };
      try {
        id ? await api.put('/countries/' + id, body) : await api.post('/countries', body);
        closeModal(); load();
      } catch (err) {
        document.getElementById('modal-alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });

    async function del(id) {
      if (!confirm('Видалити цю країну?')) return;
      try { await api.delete('/countries/' + id); load(); }
      catch (err) {
        document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
