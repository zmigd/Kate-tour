<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Готелі — TourAgency</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar" id="main-nav"></nav>

  <div class="mgr-layout">
    <nav class="mgr-sidebar" id="mgr-sidebar"></nav>

    <main class="mgr-content">
      <div class="mgr-toolbar">
        <h2>Готелі</h2>
        <button class="btn btn-success" onclick="openModal()">+ Додати</button>
      </div>
      <div id="alert"></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Назва</th><th>Місто</th><th>Зірки</th><th>Дії</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-hdr">
        <h3 id="modal-title">Новий готель</h3>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div id="modal-alert"></div>
      <form id="frm">
        <input type="hidden" id="f-id">
        <div class="form-group"><label>Назва *</label><input id="f-name" required placeholder="Hilton Istanbul"></div>
        <div class="form-group">
          <label>Місто *</label>
          <select id="f-city" required><option value="">Оберіть місто</option></select>
        </div>
        <div class="form-group">
          <label>Зірки</label>
          <select id="f-stars">
            <option value="">—</option>
            <option value="1">⭐</option>
            <option value="2">⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="5">⭐⭐⭐⭐⭐</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Зберегти</button>
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Скасувати</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/manager.js"></script>
  <script>
    checkManager();
    renderSidebar('hotels');

    async function init() {
      const cities = await api.get('/cities');
      const sel = document.getElementById('f-city');
      cities.forEach(c => {
        const o = document.createElement('option');
        o.value = c._id;
        o.textContent = c.name + (c.country?.name ? ' (' + c.country.name + ')' : '');
        sel.appendChild(o);
      });
      load();
    }

    async function load() {
      const tbody = document.getElementById('tbody');
      try {
        const list = await api.get('/hotels');
        tbody.innerHTML = list.length
          ? list.map(h => `
              <tr>
                <td><strong>${h.name}</strong></td>
                <td>${h.city?.name || '—'}</td>
                <td>${h.stars ? '⭐'.repeat(h.stars) : '—'}</td>
                <td><div class="tbl-actions">
                  <button class="btn btn-ghost btn-sm" onclick='edit(${JSON.stringify(h)})'>✏️</button>
                  <button class="btn btn-danger btn-sm" onclick="del('${h._id}')">🗑</button>
                </div></td>
              </tr>`).join('')
          : '<tr><td colspan="4"><div class="empty"><p>Готелів ще немає</p></div></td></tr>';
      } catch (err) {
        document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function openModal(h) {
      document.getElementById('modal-title').textContent = h ? 'Редагувати готель' : 'Новий готель';
      document.getElementById('f-id').value    = h?._id   || '';
      document.getElementById('f-name').value  = h?.name  || '';
      document.getElementById('f-city').value  = h?.city?._id || h?.city || '';
      document.getElementById('f-stars').value = h?.stars || '';
      document.getElementById('modal-alert').innerHTML = '';
      document.getElementById('modal').classList.add('open');
    }
    function edit(h)    { openModal(h); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }

    document.getElementById('frm').addEventListener('submit', async e => {
      e.preventDefault();
      const id = document.getElementById('f-id').value;
      const body = {
        name:  document.getElementById('f-name').value,
        city:  document.getElementById('f-city').value,
        stars: document.getElementById('f-stars').value ? +document.getElementById('f-stars').value : undefined
      };
      try {
        id ? await api.put('/hotels/' + id, body) : await api.post('/hotels', body);
        closeModal(); load();
      } catch (err) {
        document.getElementById('modal-alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });

    async function del(id) {
      if (!confirm('Видалити цей готель?')) return;
      try { await api.delete('/hotels/' + id); load(); }
      catch (err) {
        document.getElementById('alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
