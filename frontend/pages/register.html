<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація — TourAgency</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar" id="main-nav"></nav>

  <div class="page-center">
    <div class="form-card">
      <div class="form-card__title">Реєстрація</div>
      <div class="form-card__sub">Створіть акаунт безкоштовно</div>

      <div id="alert"></div>

      <form id="form" autocomplete="on">
        <div class="form-group">
          <label>Ім'я</label>
          <input type="text" id="name" placeholder="Іван Петренко" required autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Телефон</label>
          <input type="tel" id="phone" placeholder="+380XXXXXXXXX" autocomplete="tel">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="password" placeholder="мін. 6 символів" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Роль</label>
          <select id="role">
            <option value="client">👤 Клієнт</option>
            <option value="manager">👔 Менеджер</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">
          Зареєструватись →
        </button>
      </form>

      <div class="form-foot">
        Вже є акаунт? <a href="/pages/login.html">Увійти</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">✈ TourAgency</div>
      <div class="footer-copy">© 2025 TourAgency</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      alertEl.innerHTML = '';
      try {
        const data = await api.post('/auth/register', {
          name:     document.getElementById('name').value,
          email:    document.getElementById('email').value,
          phone:    document.getElementById('phone').value,
          password: document.getElementById('password').value,
          role:     document.getElementById('role').value
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user',  JSON.stringify(data.user));
        window.location.href = data.user.role === 'manager'
          ? '/pages/manager/dashboard.html' : '/';
      } catch (err) {
        alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
