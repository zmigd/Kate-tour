<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профіль — TourAgency</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar" id="main-nav"></nav>

  <div class="profile-wrap">
    <div id="alert"></div>
    <div class="profile-card" id="card">
      <div class="loading">Завантаження...</div>
    </div>
  </div>

  <footer class="footer"><p>© 2025 TourAgency</p></footer>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    async function load() {
      if (!localStorage.getItem('token')) {
        window.location.href = '/pages/login.html';
        return;
      }
      try {
        const u = await api.get('/auth/me');
        const initial = u.name?.charAt(0)?.toUpperCase() || '?';
        const roleLabel = u.role === 'manager' ? 'Менеджер' : 'Клієнт';

        document.getElementById('card').innerHTML = `
          <div class="profile-avatar">${initial}</div>
          <h2>Мій профіль</h2>

          <div class="form-group">
            <label>Ім'я</label>
            <input value="${u.name || ''}" disabled>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input value="${u.email || ''}" disabled>
          </div>
          <div class="form-group">
            <label>Телефон</label>
            <input value="${u.phone || '—'}" disabled>
          </div>
          <div class="form-group">
            <label>Роль</label>
            <input value="${roleLabel}" disabled>
          </div>

          <hr class="divider">

          <div class="profile-links">
            <a href="/pages/history.html" class="btn btn-primary">📋 Мої бронювання</a>
            ${u.role === 'manager'
              ? '<a href="/pages/manager/dashboard.html" class="btn btn-ghost">⚙️ Панель менеджера</a>'
              : ''}
          </div>`;
      } catch (err) {
        document.getElementById('alert').innerHTML =
          `<div class="alert alert-error">${err.message}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
